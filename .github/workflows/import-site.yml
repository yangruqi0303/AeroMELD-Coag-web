name: Import website source
on:
  push:
    paths:
      - .github/workflows/import-site.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact website files
        if: hashFiles('.import/site.part-01') != ''
        shell: bash
        run: |
          python - <<'PYTHON'
          import base64, hashlib, io, pathlib, zipfile
          parts = sorted(pathlib.Path('.import').glob('site.part-*'))
          assert len(parts) == 4, 'Expected four source segments'
          archive = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(archive).hexdigest() == 'f7f1652e8f7a10b61982774ba0d09b4e42770d417c060949188651519bb5acb3', 'Archive checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              for member in source.namelist():
                  p = pathlib.PurePosixPath(member)
                  assert not p.is_absolute() and '..' not in p.parts
              source.extractall('.')
              print('Restored', len(source.namelist()), 'website source files')
          PYTHON
          sha256sum -c source-manifest.sha256
          node --check dist/app.js
          node --check dist/result-animations.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .import
          git add dist tools README.md .gitignore source-manifest.sha256
          git commit -m "Import verified AeroMELD-Coag website and original assets"
          git push origin HEAD:main
